server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /slow/ throttles every response so a crawl takes long enough to kill the worker mid-way
    # (used by `scripts/e2e_smoke.py --with-crash`). Each page is ~6 KB, so ~6 s per page.
    location /slow/ {
        limit_rate_after 0;
        limit_rate 1k;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
